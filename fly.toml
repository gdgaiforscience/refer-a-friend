# fly.toml app configuration file generated for gdg-refer
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "gdg-refer"
primary_region = "syd" # Feel free to change this to an AWS region closer to you (e.g. ord, iad, lhr)

[build]
  dockerfile = "Dockerfile"

[env]
  # Public URL for this app — derived from the app name above.
  # Update if you use a custom domain.
  DOMAIN_URL = "https://gdg-refer.fly.dev"
  # We read the DB from the mounted volume so it survives restarts
  DATABASE_URL = "sqlite:////data/gdg_referrals.db"

[mounts]
  source = "data_vol"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
