# fly.toml app configuration file generated for gdg-refer on 2026-02-20T06:45:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gdg-refer'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
