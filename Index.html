<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <!-- Replace placeholder site key with actual site key -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>


    <style>
        /* (Keep all your existing CSS styles exactly as they are) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.5rem;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004494;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #result-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            word-break: break-all;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-content">
            <h2 id="form-title">Refer-a-Friend</h2>
            <form id="referralForm" onsubmit="handleFormSubmit(event)">
                <label for="email">Your Email Address:</label>
                <input type="email" id="email" required placeholder="you@example.com">

                <label for="website">Select Site/Event to Share:</label>
                <select id="website" required>
                    <option value="" disabled selected>Loading events...</option>
                </select>

                <button type="submit" id="submitBtn" disabled>Get My Unique Link</button>
            </form>
            <div id="loading" style="display: none; margin-top: 20px; text-align: center;">Generating link...</div>
            <div id="result-area">
                <div id="message"></div>
                <div id="referralLink" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <script>
        // Replace this with your actual Site Key
        const RECAPTCHA_SITE_KEY = '6LcqXIYsAAAAAHTs7AKmf-bFd8Z59c1tiJOwE3u6';

        // Load events on page load
        (function loadEvents() {
            google.script.run
                .withSuccessHandler(function (events) {
                    const select = document.getElementById('website');
                    const submitBtn = document.getElementById('submitBtn');

                    select.innerHTML = '<option value="" disabled selected>Choose an event...</option>';

                    if (events && events.length > 0) {
                        events.forEach(function (event) {
                            const option = document.createElement('option');
                            option.value = event.url;
                            option.text = event.name;
                            select.appendChild(option);
                        });
                        submitBtn.disabled = false;
                    } else {
                        select.innerHTML = '<option value="" disabled>No events available</option>';
                    }
                })
                .withFailureHandler(function (error) {
                    const select = document.getElementById('website');
                    select.innerHTML = '<option value="" disabled>Error loading events</option>';
                })
                .getEvents();
        })();

        function handleFormSubmit(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const website = document.getElementById('website').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultArea = document.getElementById('result-area');
            const loadingDiv = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            const linkDiv = document.getElementById('referralLink');

            if (!website) {
                alert("Please select an event.");
                return;
            }

            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';
            resultArea.style.display = 'none';
            messageDiv.className = '';
            messageDiv.innerText = '';
            linkDiv.innerHTML = '';

            // Note: recaptchaToken is passed as null for now as per instructions
            google.script.run
                .withSuccessHandler(function (response) {
                    submitBtn.disabled = false;
                    loadingDiv.style.display = 'none';
                    resultArea.style.display = 'block';

                    if (response.success) {
                        resultArea.className = 'success';
                        messageDiv.innerText = "Success! Here is your unique referral link:";
                        linkDiv.innerHTML = '<a href="' + response.link + '" target="_blank">' + response.link + '</a>';
                    } else {
                        resultArea.className = 'error';
                        messageDiv.innerText = response.message || "An error occurred.";
                    }
                })
                .withFailureHandler(function (error) {
                    submitBtn.disabled = false;
                    loadingDiv.style.display = 'none';
                    resultArea.style.display = 'block';
                    resultArea.className = 'error';
                    messageDiv.innerText = "Fatal Error: Failed to connect to server.";
                })
                .generateReferralLink(email, website, null);
        }
    </script>
</body>

</html>
